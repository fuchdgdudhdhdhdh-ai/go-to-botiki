services:
  - type: web
    name: telegram-userbot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: TG_API_ID
        sync: false
      - key: TG_API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: TG_ADMIN_ID
        sync: false
      - key: SESSION_DIR
        value: /data
    disk:
      name: userbot-data
      mountPath: /data
      sizeGB: 1
